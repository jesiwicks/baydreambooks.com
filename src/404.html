<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Baydream Books</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root { --bg:#FBF8F2; --text:#2B2A28; --muted:#5A564F; --accent:#A8492F; --focus:#1F4E79; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 18px; line-height: 1.6; text-align: center; }
  main { max-width: 640px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-size: clamp(36px, 7vw, 56px); line-height: 1.1; font-weight: 700; }
  p { margin: 0; color: var(--muted); }
  a { display: inline-block; margin-top: 8px; padding: 14px 28px; border-radius: 999px; background: var(--accent); color: #FFFFFF; font-weight: 600; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That page isn't here.</p>
  <a href="/">Go to the home page</a>
</main>
</body>
</html>
