<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baydream Books | Bionic Lettering Editions of Public Domain Classics</title>
<meta name="description" content="Baydream Books publishes Bionic Lettering editions of public domain classics. Site coming soon.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://baydreambooks.com/">
<link rel="preload" href="/fonts/fraunces-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root { --bg:#FBF8F2; --text:#2B2A28; --muted:#5A564F; --accent:#A8492F; --focus:#1F4E79; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 18px; line-height: 1.6; text-align: center; }
  main { max-width: 640px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-size: clamp(40px, 8vw, 64px); line-height: 1.1; font-weight: 700; }
  p { margin: 0; color: var(--muted); }
  .soon { color: var(--accent); font-weight: 600; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Baydream Books</h1>
  <p>Bionic Lettering editions of public domain classics</p>
  <p class="soon">Coming soon</p>
</main>
</body>
</html>
